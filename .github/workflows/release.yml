name: Release

# Builds Zonn Node installers. Each bundles the self-contained inference runner
# from the backend's release BACKEND_TAG (the backend repository is private;
# the BACKEND_RELEASE_TOKEN secret needs read access to it):
#
#   Windows   Zonn-Node-Setup-Windows-x64.exe, and -NVIDIA.exe with CUDA
#   Linux     zonn-node_VERSION_amd64.deb, and zonn-node-nvidia with CUDA
#   macOS     Zonn-Node-VERSION-macOS-apple-silicon.dmg (Intel Macs are not
#             built: the inference runner needs a newer PyTorch than they get)
#
# Installers are uploaded as workflow artifacts for checking on clean
# machines. The last job collects all of them into one artifact,
# zonn-node-release-VERSION, with zonn-node-release.json (versions, sizes,
# SHA-256) and SHA256SUMS. Publishing is a separate, deliberate step: copy
# that artifact's files into the server's deploy/downloads folder, and the
# backend offers them to nodes as updates.
#
# Code signing: macOS apps are ad hoc signed (free). Developer ID signing and
# notarization, and Windows Authenticode, run only when their secrets exist
# (MACOS_SIGNING_IDENTITY with MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD,
# APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD; WINDOWS_CERTIFICATE_PFX and
# WINDOWS_CERTIFICATE_PASSWORD). None are set yet; see the install guide for
# what testers see meanwhile.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version, without the v prefix
        required: true
      backend_tag:
        description: Backend release whose runner bundles to ship, for example v0.2.0
        required: true

permissions:
  contents: read

jobs:
  installers:
    name: ${{ matrix.label }} ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, label: linux-x64, platform: linux/amd64, variant: cpu }
          - { os: ubuntu-22.04, label: linux-x64, platform: linux/amd64, variant: nvidia }
          - { os: windows-latest, label: windows-x64, platform: windows/amd64, variant: cpu }
          - { os: windows-latest, label: windows-x64, platform: windows/amd64, variant: nvidia }
          - { os: macos-15, label: macos-apple-silicon, platform: darwin/arm64, variant: cpu, dmg: apple-silicon }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ inputs.version }}
      # Signing secrets; empty until certificates exist, which skips the steps.
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Free disk space for the CUDA build
        if: runner.os == 'Linux' && matrix.variant == 'nvidia'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Validate the version
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]] || { echo "invalid version $VERSION"; exit 1; }

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Fetch the inference runner from the backend release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BACKEND_RELEASE_TOKEN }}
          BACKEND_REPO: ${{ vars.BACKEND_REPO || 'zonnhq/backend' }}
          RUNNER_LABEL: ${{ matrix.label }}
        run: scripts/fetch-runner.sh ${{ matrix.variant }} --release "${{ inputs.backend_tag }}"

      - name: Build the desktop app
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("wails.json")); p.info.productVersion=process.env.VERSION; fs.writeFileSync("wails.json", JSON.stringify(p, null, 2)+"\n")'
          wails build -clean -trimpath -tags "desktop,webkit2_41" \
            -ldflags "-X github.com/zonnhq/node-gui/internal/version.Version=v${VERSION} -X github.com/zonnhq/node-gui/internal/version.Variant=${{ matrix.variant }}" \
            -skipbindings -platform "${{ matrix.platform }}" -webview2 embed -o zonn-node

      - name: Ubuntu package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          build/linux/build-deb.sh "$VERSION" ${{ matrix.variant }}
          dpkg-deb --info build/installer/*.deb

      - name: macOS signing certificate (only when the secrets exist)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != ''
        shell: bash
        run: |
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$RUNNER_TEMP/sign.keychain"
          security default-keychain -s "$RUNNER_TEMP/sign.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/sign.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/sign.keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$RUNNER_TEMP/sign.keychain"

      - name: macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          build/darwin/build-dmg.sh "$VERSION" ${{ matrix.dmg }}
          hdiutil verify build/installer/*.dmg

      - name: macOS notarization (only when the secrets exist)
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        shell: bash
        run: |
          for dmg in build/installer/*.dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$dmg"
          done

      - name: Windows Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $sourceDir = (Resolve-Path "build/bin").Path
          if (Test-Path "$sourceDir\zonn-node") { Move-Item "$sourceDir\zonn-node" "$sourceDir\zonn-node.exe" }
          Copy-Item -Recurse "build/worker/*" "$sourceDir/"
          $variant = @()
          if ("${{ matrix.variant }}" -eq "nvidia") { $variant = @("/DNvidia") }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:VERSION" "/DSourceDir=$sourceDir" `
            "/DIconFile=$((Resolve-Path 'build/zonn-node.ico').Path)" @variant `
            "build/windows/zonn-node.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows Authenticode signing (only when the secrets exist)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_PFX != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          foreach ($exe in Get-ChildItem "build/installer/*.exe") {
            & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $exe.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: zonn-node-${{ matrix.label }}-${{ matrix.variant }}-${{ inputs.version }}
          path: build/installer/*
          if-no-files-found: error

  release:
    name: Release manifest and checksums
    needs: installers
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: zonn-node-*-${{ inputs.version }}
          path: release
          merge-multiple: true
      - name: Write zonn-node-release.json and SHA256SUMS
        run: python3 scripts/release-manifest.py "${{ inputs.version }}" release
      - uses: actions/upload-artifact@v4
        with:
          name: zonn-node-release-${{ inputs.version }}
          path: release/*
          if-no-files-found: error
